services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-copilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-copilot}
      POSTGRES_DB: ${POSTGRES_DB:-copilot}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-copilot}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Optional — event bus / cache. The app runs without it (EVENT_BUS=memory).
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    profiles: ["redis"]

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-copilot}:${POSTGRES_PASSWORD:-copilot}@db:5432/${POSTGRES_DB:-copilot}
      EVENT_BUS: ${EVENT_BUS:-memory}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      STT_PROVIDER: ${STT_PROVIDER:-mock}
      STT_LANGUAGE: ${STT_LANGUAGE:-en}
      STT_SPEAKER_DETECTION: ${STT_SPEAKER_DETECTION:-false}
      STT_PROMPT: ${STT_PROMPT:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_REALTIME_MODEL: ${OPENAI_REALTIME_MODEL:-gpt-live-transcribe}
      WISPR_FLOW_API_KEY: ${WISPR_FLOW_API_KEY:-}
      WISPR_FLOW_ACCESS_TOKEN: ${WISPR_FLOW_ACCESS_TOKEN:-}
      FASTER_WHISPER_MODEL: ${FASTER_WHISPER_MODEL:-small.en}
      FASTER_WHISPER_DEVICE: ${FASTER_WHISPER_DEVICE:-auto}
      FASTER_WHISPER_COMPUTE_TYPE: ${FASTER_WHISPER_COMPUTE_TYPE:-default}
      FASTER_WHISPER_CHUNK_SECONDS: ${FASTER_WHISPER_CHUNK_SECONDS:-3.0}
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-mock}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head &&
             python -m app.seed --if-empty &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
      NEXT_PUBLIC_WS_BASE_URL: ${NEXT_PUBLIC_WS_BASE_URL:-ws://localhost:8000}
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  pgdata:
